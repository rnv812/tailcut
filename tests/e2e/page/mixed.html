<!doctype html>
<meta charset="utf-8" />
<title>banner and player</title>
<!--
  Обе раскладки сразу: рекламный баннер и настоящий плеер на одной странице. Вердикт
  адресный, поэтому отказ по баннеру не должен трогать материал плеера. Кодеки взяты
  разные (vp9 и avc1) намеренно: ключ сессии считается по адресу и кодекам, а адрес
  у обоих один — на одном кодеке сессия оказалась бы общей, и адресность отказа
  проверить было бы нечем.
-->
<video id="banner" muted loop autoplay width="160" height="90" style="background:#333"></video>
<video id="player" controls loop width="640" style="background:#000"></video>
<script>
  const FEEDS = {
    banner: {
      mime: 'video/mp4; codecs="vp09.00.10.08"',
      files: ['/fixtures/vp9/init-stream0.m4s', '/fixtures/vp9/chunk-stream0-00001.m4s'],
    },
    player: {
      mime: 'video/mp4; codecs="avc1.4d401e"',
      files: [
        '/fixtures/h264/init-stream0.m4s',
        '/fixtures/h264/chunk-stream0-00001.m4s',
        '/fixtures/h264/chunk-stream0-00002.m4s',
        '/fixtures/h264/chunk-stream0-00003.m4s',
      ],
    },
  }

  window.appended = { banner: 0, player: 0 }

  async function feed(id) {
    const { mime, files } = FEEDS[id]
    const video = document.getElementById(id)
    const mediaSource = new MediaSource()
    video.src = URL.createObjectURL(mediaSource)

    await new Promise((r) => mediaSource.addEventListener('sourceopen', r, { once: true }))
    const sb = mediaSource.addSourceBuffer(mime)

    for (const url of files) {
      const buffer = await (await fetch(url)).arrayBuffer()
      await new Promise((r) => {
        sb.addEventListener('updateend', r, { once: true })
        sb.appendBuffer(buffer)
      })
      window.appended[id]++
    }
  }

  Promise.all([feed('banner'), feed('player')]).then(() => {
    window.allAppended = true
  })
</script>
