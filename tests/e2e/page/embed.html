<!doctype html>
<meta charset="utf-8" />
<!--
  A common layout: the player lives in a nested frame while the top page belongs to another host.
  Content scripts use all_frames, so the bridge runs in both documents and each handshake must
  reach its own frame. The player URL matches PAGE_URL in bridge.spec.ts.
-->
<title>embedding host</title>
<script>
  // Install the listener before the player frame so a misrouted handshake is visible here.
  window.bridgeReady = []
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'tc:ready') window.bridgeReady.push(e.origin)
  })
</script>
<iframe id="player" src="https://tailcut.test/player" width="640" height="360"></iframe>
