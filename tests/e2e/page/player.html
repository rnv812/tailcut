<!doctype html>
<meta charset="utf-8" />
<!--
  An intentionally strict policy: frame-src 'none' prevents the page from loading any foreign
  frames, exactly the case that threatens the bridge. media-src blob: and style-src 'unsafe-inline'
  only let the page play: default-src 'self' blocks both the MediaSource blob URL and the <video>
  style attribute. The frame restriction remains unchanged.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; frame-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src blob:"
/>
<title>test player</title>
<video id="v" controls width="640" style="background:#000"></video>
<script>
  // Policy violations are visible only inside the page. Without this log the suite would also
  // pass on a page with no meta policy at all. The negative control in bridge.spec.ts inserts an
  // ordinary frame and requires the policy to block it.
  window.cspViolations = []
  document.addEventListener('securitypolicyviolation', (e) => {
    window.cspViolations.push({ directive: e.effectiveDirective, blockedURI: e.blockedURI })
  })

  // The bridge must appear at document_start, before the page's first script.
  window.bridgeAtScriptStart = !!document.querySelector('iframe[data-tailcut]')

  // The bridge sends its handshake to the parent window; record each sender origin.
  window.bridgeReady = []
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'tc:ready') window.bridgeReady.push(e.origin)
  })

  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]
  /**
   * The next six seconds, in another representation of the picture: what an ABR player switches
   * to. Another init and a segment that carries on where the three above stop.
   */
  const NEXT_INIT = '/fixtures/minute/init-stream0.m4s'
  const NEXT = '/fixtures/minute/chunk-stream0-00002.m4s'

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)
  // The very MediaSource that is playing: a test that states a duration has to state it on this
  // one, or the hook never hears of it. Named apart from `tcSource`, which is the probe array the
  // hook sets tell themselves what the hook saw — a page that overwrote it broke four of them.
  window.tcPlayerSource = mediaSource

  window.appended = 0

  const fetchBytes = async (url) => (await fetch(url)).arrayBuffer()

  const append = (buffer, into) =>
    new Promise((resolve) => {
      into.addEventListener('updateend', resolve, { once: true })
      into.appendBuffer(buffer)
    })

  /** The buffer of the picture, kept so that the page can go on feeding it after playback began. */
  let picture

  mediaSource.addEventListener('sourceopen', async () => {
    picture = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')

    await append(await fetchBytes(INIT), picture)
    window.appended++

    for (const url of SEGMENTS) {
      await append(await fetchBytes(url), picture)
      window.appended++
    }

    window.allAppended = true
  })

  /*
    Two things this page does only when it is asked, so that everything already written against it
    goes on seeing what it always saw: appended once, looped, nothing new ever arriving.
  */

  /**
   * The same stretch handed over a second time, init and all: a rewatch, a seek back, a player
   * refilling its buffer. Not one byte of it is new material.
   */
  window.tcAppendAgain = async () => {
    await append(await fetchBytes(INIT), picture)
    for (const url of SEGMENTS) await append(await fetchBytes(url), picture)
  }

  /**
   * Six more seconds of picture, in another representation and long after the first three
   * segments: the quality switch, into the buffer that is already playing.
   *
   * The one thing here that is material the session did not have before, so the only way to ask
   * whether what arrives after a session has been re-keyed lands in the row of what arrived
   * before it. A second SourceBuffer would have been the other way and Chrome refuses it: once
   * media has been appended, `addSourceBuffer` throws QuotaExceededError.
   */
  window.tcAppendMore = async () => {
    await append(await fetchBytes(NEXT_INIT), picture)
    await append(await fetchBytes(NEXT), picture)
    window.moreAppended = true
  }
</script>
