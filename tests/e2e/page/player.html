<!doctype html>
<meta charset="utf-8" />
<!--
  Намеренно строгая политика: frame-src 'none' запрещает странице любые посторонние фреймы —
  тот самый случай, которого мы опасаемся для моста. media-src blob: и style-src 'unsafe-inline'
  добавлены только чтобы страница вообще играла: default-src 'self' блокирует и blob-источник
  MediaSource, и style-атрибут <video>. Запрет фреймов при этом не ослаблен.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; frame-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src blob:"
/>
<title>test player</title>
<video id="v" controls width="640" style="background:#000"></video>
<script>
  // Нарушения политики видны только изнутри страницы. Без этого журнала проверки набора
  // остались бы зелёными и на странице, где меты выше нет вовсе: негативный контроль в
  // bridge.spec.ts вставляет обычный фрейм и требует, чтобы политика его запретила.
  window.cspViolations = []
  document.addEventListener('securitypolicyviolation', (e) => {
    window.cspViolations.push({ directive: e.effectiveDirective, blockedURI: e.blockedURI })
  })

  // Мост обязан встать на document_start — раньше первого скрипта страницы.
  window.bridgeAtScriptStart = !!document.querySelector('iframe[data-tailcut]')

  // Рукопожатие мост шлёт в родительское окно; запоминаем origin отправителей.
  window.bridgeReady = []
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'tc:ready') window.bridgeReady.push(e.origin)
  })

  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)
  // The very MediaSource that is playing: a test that states a duration has to state it on this
  // one, or the hook never hears of it. Named apart from `tcSource`, which is the probe array the
  // hook sets tell themselves what the hook saw — a page that overwrote it broke four of them.
  window.tcPlayerSource = mediaSource

  window.appended = 0

  mediaSource.addEventListener('sourceopen', async () => {
    const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')

    const append = (buffer) =>
      new Promise((resolve) => {
        sb.addEventListener('updateend', resolve, { once: true })
        sb.appendBuffer(buffer)
      })

    const fetchBytes = async (url) => (await fetch(url)).arrayBuffer()

    await append(await fetchBytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await append(await fetchBytes(url))
      window.appended++
    }

    window.allAppended = true
  })
</script>
