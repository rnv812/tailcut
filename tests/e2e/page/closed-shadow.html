<!doctype html>
<meta charset="utf-8" />
<title>closed shadow player</title>
<!--
  Тот же плеер в закрытом shadow root. Ссылку на корень отдаёт только attachShadow, и наружу
  она не выходит: element.shadowRoot равен null, обойти это нечем. Элемент не измерить — значит,
  и вердикта по нему не вынести; расширение обязано не записать такой поток, а не записать его
  без разбора.
-->
<div id="host"></div>
<script>
  const root = document.getElementById('host').attachShadow({ mode: 'closed' })
  root.innerHTML = '<video id="v" controls width="640" style="background:#000"></video>'
  const video = root.querySelector('video')

  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  window.appended = 0
  window.playerSrc = video.src
  // Ролик крутится по кругу: элемент, недостижимый для наблюдателя, играет всё время опыта —
  // пустой реестр не должен объясняться тем, что видео просто кончилось.
  video.loop = true

  mediaSource.addEventListener('sourceopen', async () => {
    const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
    const append = (buffer) =>
      new Promise((resolve) => {
        sb.addEventListener('updateend', resolve, { once: true })
        sb.appendBuffer(buffer)
      })
    const bytes = async (url) => (await fetch(url)).arrayBuffer()

    await append(await bytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await append(await bytes(url))
      window.appended++
    }

    await video.play().catch(() => {})
    window.allAppended = true
  })
</script>
