<!doctype html>
<meta charset="utf-8" />
<title>shadow player</title>
<!--
  Плеер внутри открытого shadow root — так устроен tv.apple.com: играющий <video> 1265x712,
  которого document.querySelectorAll('video') не находит. Всё остальное на странице обычное:
  MediaSource создаётся в главном мире, адрес из createObjectURL кладётся в video.src.
-->
<div id="host"></div>
<script>
  const root = document.getElementById('host').attachShadow({ mode: 'open' })
  root.innerHTML = '<video id="v" controls width="640" style="background:#000"></video>'
  const video = root.querySelector('video')

  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  window.appended = 0
  // Тесту нужен адрес потока, а до элемента в shadow root он дотянуться не должен уметь:
  // страница называет его сама.
  window.playerSrc = video.src

  mediaSource.addEventListener('sourceopen', async () => {
    const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
    const append = (buffer) =>
      new Promise((resolve) => {
        sb.addEventListener('updateend', resolve, { once: true })
        sb.appendBuffer(buffer)
      })
    const bytes = async (url) => (await fetch(url)).arrayBuffer()

    await append(await bytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await append(await bytes(url))
      window.appended++
    }

    window.allAppended = true
  })
</script>
