<!doctype html>
<meta charset="utf-8" />
<title>measured player</title>
<video id="v" controls width="640" style="background: #000"></video>
<script>
  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  // Repeated passes over the same segments. One appendBuffer call spends tens of microseconds on
  // its synchronous path, below performance.now() resolution (100 µs in Chrome), so one sample
  // reveals nothing. Across hundreds of samples, timer quantization averages out and the share of
  // non-zero readings tracks the real duration.
  const WARMUP_PASSES = 2
  const MEASURED_PASSES = 100
  const PASS_SECONDS = 6
  // Calibrate with many short batches. A long batch allocates tens of megabytes and inevitably
  // catches a garbage-collector pause, while at least one short batch runs between pauses and
  // exposes the clean copy cost.
  const COPY_BATCH_PASSES = 20
  const COPY_RUNS = 25

  // Keep every sample instead of one total. The test needs both the count, proving that the page
  // completed, and the distribution for diagnosing a failure.
  window.appendSamples = []
  // Cost of one copy of the same bytes on this machine. The test threshold uses copies rather than
  // milliseconds because the wrapper should cost one segment copy and both values scale together
  // on a slower machine.
  window.copyBaselineMs = 0
  window.copyCount = COPY_BATCH_PASSES * SEGMENTS.length
  window.measured = false
  window.failure = null

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  mediaSource.addEventListener('sourceopen', async () => {
    try {
      const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')

      // Fetch bytes once so networking is excluded. Re-serving fixtures through Playwright routing
      // costs far more than appendBuffer itself.
      const fetchBytes = async (url) => (await fetch(url)).arrayBuffer()
      const initBytes = await fetchBytes(INIT)
      const segmentBytes = await Promise.all(SEGMENTS.map(fetchBytes))

      const append = (buffer, record) =>
        new Promise((resolve, reject) => {
          sb.addEventListener('updateend', resolve, { once: true })
          sb.addEventListener('error', () => reject(new Error('appendBuffer failed')), {
            once: true,
          })
          const t0 = performance.now()
          sb.appendBuffer(buffer)
          const spent = performance.now() - t0
          if (record) window.appendSamples.push(spent)
        })

      // Phase 1: time spent inside appendBuffer.
      await append(initBytes, false)
      for (let pass = 0; pass < WARMUP_PASSES + MEASURED_PASSES; pass++) {
        // Exclude warm-up: the first passes start the decoder and grow MSE's internal buffers,
        // adding a one-time cost that distorts both modes equally.
        const record = pass >= WARMUP_PASSES
        for (const bytes of segmentBytes) await append(bytes, record)
        sb.timestampOffset += PASS_SECONDS
      }

      // Phase 2: calibrate on the same warm machine and bytes. Read the clock once for the whole
      // run so timer resolution does not matter. Use the minimum rather than the average: copying
      // allocates memory, averages include garbage-collector pauses, and the minimum exposes a
      // stable clean copy cost. Calibrate after measurement so the measured path does not inherit
      // garbage-collection work from hundreds of consecutive allocations.
      const copyOnce = () => {
        const t0 = performance.now()
        for (let pass = 0; pass < COPY_BATCH_PASSES; pass++) {
          for (const bytes of segmentBytes) window.copySink = bytes.slice(0)
        }
        return performance.now() - t0
      }
      copyOnce()
      let best = Infinity
      for (let run = 0; run < COPY_RUNS; run++) best = Math.min(best, copyOnce())
      window.copyBaselineMs = best

      window.measured = true
    } catch (error) {
      // Otherwise a handler failure disappears into a rejected promise and the test waits for
      // window.measured until timeout, reporting the timeout instead of the cause.
      window.failure = String(error)
    }
  })
</script>
