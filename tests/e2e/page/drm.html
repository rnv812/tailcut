<!doctype html>
<meta charset="utf-8" />
<title>clearkey player</title>
<!--
  Страница, которая просит у браузера систему ключей, — ровно так это делает защищённый плеер
  (в обследовании: sample dash.js ClearKey и tv.apple.com, где EME обсуждается прямо во время
  трейлера). Обхода защиты здесь нет и быть не может: расширение отказывается по самому факту
  обращения к EME, до того как ключи выданы, а материал страницы — обычный незашифрованный
  fixture. Проверяется отказ, а не чтение защищённого потока.

  Обращение за ключами отложено до сигнала из теста. К этому моменту ролик успевает отыграть
  испытательный срок, и сессия подтверждена: отказ сортировки такую сессию только замораживает
  и сохраняет накопленное (§5.5). Отказ по DRM обязан быть сильнее — не оставить ничего.
-->
<video id="v" controls width="640" style="background:#000"></video>
<script>
  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  window.appended = 0
  window.keysAsked = false
  window.keysError = null

  /** Тест решает, когда плеер обратится за ключами. */
  const keysWanted = new Promise((resolve) => {
    window.askForKeys = resolve
  })

  mediaSource.addEventListener('sourceopen', async () => {
    const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
    const append = (buffer) =>
      new Promise((resolve) => {
        sb.addEventListener('updateend', resolve, { once: true })
        sb.appendBuffer(buffer)
      })
    const bytes = async (url) => (await fetch(url)).arrayBuffer()

    await append(await bytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await append(await bytes(url))
      window.appended++
    }

    window.allAppended = true

    await keysWanted

    try {
      const access = await navigator.requestMediaKeySystemAccess('org.w3.clearkey', [
        {
          initDataTypes: ['cenc'],
          videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.4d401e"' }],
        },
      ])
      await video.setMediaKeys(await access.createMediaKeys())
    } catch (error) {
      window.keysError = String(error)
    }

    // Страница играет дальше как ни в чём не бывало: отказ расширения её не касается.
    window.keysAsked = true
  })
</script>
