<!doctype html>
<meta charset="utf-8" />
<title>probing player</title>
<!--
  A page that probes browser key systems while playing clear material. It matches an edition.cnn.com
  article: sixteen requestMediaKeySystemAccess calls in one and a half seconds, some rejected and some
  granted, setMediaKeys called only with null, and no encryption box in the stream.

  The extension once discarded every recording on a page merely because it used EME. A real
  367x648 video with audio, watched for forty seconds, was lost. A probe expresses intent rather
  than protected material, so this page must be recorded completely.
-->
<video id="v" controls width="640" style="background:#000"></video>
<script>
  /** Key systems probed by an ordinary player; the browser rejects some and grants others. */
  const KEY_SYSTEMS = [
    'com.widevine.alpha',
    'com.microsoft.playready',
    'com.apple.fps.1_0',
    'org.w3.clearkey',
  ]

  const CONFIG = [
    {
      initDataTypes: ['cenc'],
      videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.4d401e"' }],
    },
  ]

  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  window.appended = 0
  /** Number of probes made and accepted by the browser. */
  window.probes = { asked: 0, granted: 0, refused: 0 }
  window.probesDone = false

  /** Capability probing matches what a news-site player does before starting. */
  async function probe() {
    for (const keySystem of KEY_SYSTEMS) {
      window.probes.asked++
      try {
        await navigator.requestMediaKeySystemAccess(keySystem, CONFIG)
        window.probes.granted++
      } catch {
        window.probes.refused++
      }
    }

    // No keys are attached to the element because the page only probes. The measured player did
    // the same: setMediaKeys was called exactly once with null.
    await video.setMediaKeys(null)
    window.probesDone = true
  }

  mediaSource.addEventListener('sourceopen', async () => {
    const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
    const append = (buffer) =>
      new Promise((resolve) => {
        sb.addEventListener('updateend', resolve, { once: true })
        sb.appendBuffer(buffer)
      })
    const bytes = async (url) => (await fetch(url)).arrayBuffer()

    await probe()

    await append(await bytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await append(await bytes(url))
      window.appended++
    }

    window.allAppended = true
  })
</script>
