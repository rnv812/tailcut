<!doctype html>
<meta charset="utf-8" />
<title>clearkey player</title>
<!--
  A page shaped like the dash.js ClearKey sample and tv.apple.com: an unencrypted free preview is
  followed by licensed material protected with Common Encryption. The extension never attempts to
  bypass that protection. It rejects the stream based on the init segment's encv/sinf/tenc boxes
  without reading any encrypted payload bytes.

  The protected init arrives when the test requests it. By then the first video has passed
  classification and established a session. A later classification refusal would preserve its
  captured material, but encryption rejection must remove the session completely.
-->
<video id="clear" controls width="640" style="background:#000"></video>
<video id="licensed" controls width="640" style="background:#000"></video>
<script>
  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]
  /** A protected init: encv instead of avc1, with frma, schm, and tenc inside sinf. */
  const CENC_INIT = '/fixtures/cenc/init-stream0.m4s'

  const MIME = 'video/mp4; codecs="avc1.4d401e"'

  const bytes = async (url) => (await fetch(url)).arrayBuffer()

  /** Appends and waits for updateend so the test knows the bytes were accepted. */
  const appendTo = (sb, buffer) =>
    new Promise((resolve, reject) => {
      sb.addEventListener('updateend', resolve, { once: true })
      sb.addEventListener('error', () => reject(new Error('appendBuffer failed')), { once: true })
      sb.appendBuffer(buffer)
    })

  const opened = (mediaSource) =>
    new Promise((resolve) => mediaSource.addEventListener('sourceopen', resolve, { once: true }))

  window.appended = 0
  window.allAppended = false
  /** Result of appending the protected init; null means it has not been appended yet. */
  window.protectedAppend = null
  /** Number of clear segments appended after protected material appeared. */
  window.appendedAfter = 0

  const clear = document.getElementById('clear')
  const clearSource = new MediaSource()
  clear.src = URL.createObjectURL(clearSource)

  let clearBuffer = null

  async function playClear() {
    await opened(clearSource)
    clearBuffer = clearSource.addSourceBuffer(MIME)

    await appendTo(clearBuffer, await bytes(INIT))
    window.appended++

    for (const url of SEGMENTS) {
      await appendTo(clearBuffer, await bytes(url))
      window.appended++
    }

    window.allAppended = true
  }

  /**
   * The page's second player opens a protected stream when the test decides. By then the first
   * player has an established session, proving that encryption rejection removes it as well.
   */
  window.playProtected = async () => {
    const licensed = document.getElementById('licensed')
    const source = new MediaSource()
    licensed.src = URL.createObjectURL(source)
    await opened(source)

    // The buffer advertises ordinary avc1, as a DASH player does. Protection is declared inside
    // the init segment, where frma names the original codec.
    const sb = source.addSourceBuffer(MIME)
    try {
      await appendTo(sb, await bytes(CENC_INIT))
      window.protectedAppend = 'accepted'
    } catch (error) {
      window.protectedAppend = String(error)
    }
  }

  /** The first player keeps playing because the extension's refusal must not affect the page. */
  window.appendMore = async () => {
    await appendTo(clearBuffer, await bytes(SEGMENTS[0]))
    window.appendedAfter++
  }

  playClear()
</script>
