<!doctype html>
<meta charset="utf-8" />
<title>watched player</title>
<video id="v" muted playsinline width="640" style="background: #000"></video>
<script>
  const INIT = '/fixtures/h264/init-stream0.m4s'
  const SEGMENTS = [
    '/fixtures/h264/chunk-stream0-00001.m4s',
    '/fixtures/h264/chunk-stream0-00002.m4s',
    '/fixtures/h264/chunk-stream0-00003.m4s',
  ]

  /** Fixture media clock: the timescale from its init segment's mdhd box. */
  const TIMESCALE = 12288
  /** Three two-second segments make one pass through the fixture. */
  const PASS_SECONDS = 6
  const PASS_TICKS = PASS_SECONDS * TIMESCALE

  /** Actual playback duration: viewer-visible cost must be measured in real time. */
  const WATCH_SECONDS = 25
  /** Write size and cadence: 10 MiB every two seconds, or 5 MiB/s. */
  const BURST_BYTES = 10 * 1024 * 1024
  const BURST_MS = 2000
  /**
   * Amount of media time retained in the buffer.
   *
   * Old material is evicted because MSE keeps roughly 150 MB per track and rejects appends after
   * reaching that limit. This measurement targets disk writing rather than an unrelated buffer
   * ceiling. Eviction does not affect the extension because it observes appendBuffer and copies
   * the bytes at call time rather than reading buffered contents.
   */
  const KEEP_SECONDS = 60

  window.watched = false
  window.failure = null
  window.report = null

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  /**
   * Measure only while playback is active.
   *
   * Test setup includes loading the page, four fixture requests, and starting the decoder. That is
   * not work a viewer experiences, and a long task there says nothing about disk writing. The
   * measurement window opens on the first frame, not the first script line.
   */
  let measuring = false

  // Long tasks on the page's main thread. This directly measures visible stutter: 50 ms spans
  // three frames at 60 Hz.
  const longTasks = []
  try {
    new PerformanceObserver((list) => {
      if (!measuring) return
      for (const entry of list.getEntries()) longTasks.push(entry.duration)
    }).observe({ entryTypes: ['longtask'] })
  } catch {
    // In a browser without longtask support, the other two measurements answer the same question.
  }

  // Gaps between animation frames. A missed frame is a gap of at least two refresh periods.
  const gaps = []
  let previous = 0
  const tick = (now) => {
    if (measuring && previous) gaps.push(now - previous)
    previous = now
    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)

  const appends = []

  /**
   * Locates the 64-bit baseMediaDecodeTime in a segment.
   *
   * Walk boxes instead of searching for a byte pattern: the four bytes `tfdt` can also occur in
   * mdat, and modifying payload bytes would silently corrupt frames. Check the version for the same
   * reason so regenerating the fixture with a 32-bit tfdt fails explicitly.
   */
  function tfdtAt(bytes) {
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)

    const walk = (from, to) => {
      let at = from
      while (at + 8 <= to) {
        const size = view.getUint32(at)
        const type = String.fromCharCode(bytes[at + 4], bytes[at + 5], bytes[at + 6], bytes[at + 7])
        // This fixture contains neither size 0 (through end of file) nor size 1 (64-bit size), so
        // the measurement page does not need to infer either form.
        if (size < 8 || at + size > to) return -1
        if (type === 'tfdt') return view.getUint8(at + 8) === 1 ? at + 12 : -1
        if (type === 'moof' || type === 'traf') {
          const inside = walk(at + 8, at + size)
          if (inside >= 0) return inside
        }
        at += size
      }
      return -1
    }

    return walk(0, bytes.byteLength)
  }

  /** The same segment at another media time, produced by replacing tfdt in a copy. */
  const shifted = (segment, at, ticks) => {
    const bytes = segment.slice()
    const view = new DataView(bytes.buffer)
    view.setBigUint64(at, view.getBigUint64(at) + BigInt(ticks))
    return bytes
  }

  mediaSource.addEventListener('sourceopen', async () => {
    try {
      const sb = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
      const fetchBytes = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer())
      const initBytes = await fetchBytes(INIT)
      const segments = await Promise.all(SEGMENTS.map(fetchBytes))
      const offsets = segments.map(tfdtAt)
      if (offsets.some((at) => at < 0)) throw new Error('no 64-bit tfdt in a fixture segment')

      /**
       * One buffer operation, awaited through completion or failure.
       *
       * One `AbortController` removes both listeners together. `{ once: true }` removes only the
       * listener that fires, while the failure listener normally never does. A run would otherwise
       * accumulate about 1,800 listeners on one SourceBuffer. The measured page must not perform
       * work absent from ordinary viewing.
       */
      const operation = (start, failure) =>
        new Promise((resolve, reject) => {
          const done = new AbortController()
          const finish = (answer) => {
            done.abort()
            answer()
          }
          sb.addEventListener('updateend', () => finish(resolve), { signal: done.signal })
          sb.addEventListener('error', () => finish(() => reject(new Error(failure))), {
            signal: done.signal,
          })
          start()
        })

      const append = (buffer) =>
        operation(() => {
          const started = performance.now()
          sb.appendBuffer(buffer)
          appends.push(performance.now() - started)
        }, 'appendBuffer failed')

      const forget = (from) => operation(() => sb.remove(from, Infinity), 'remove failed')

      let pushedBytes = 0
      let passes = 0

      /** One fixture pass at its assigned media time, segment by segment. */
      const pushPass = async () => {
        const ticks = passes++ * PASS_TICKS
        for (let i = 0; i < segments.length; i++) {
          const bytes = shifted(segments[i], offsets[i], ticks)
          await append(bytes)
          pushedBytes += bytes.byteLength
        }
      }

      await append(initBytes)
      await pushPass()
      await video.play()

      measuring = true
      const startedAt = performance.now()
      while ((performance.now() - startedAt) / 1000 < WATCH_SECONDS) {
        const until = pushedBytes + BURST_BYTES
        const slotEnds = performance.now() + BURST_MS

        while (pushedBytes < until) await pushPass()
        if (passes * PASS_SECONDS > KEEP_SECONDS) await forget(KEEP_SECONDS)

        const left = slotEnds - performance.now()
        if (left > 0) await new Promise((resolve) => setTimeout(resolve, left))
      }

      const quality = video.getVideoPlaybackQuality()
      const sorted = [...appends].sort((a, b) => a - b)
      window.report = {
        droppedFrames: quality.droppedVideoFrames,
        totalFrames: quality.totalVideoFrames,
        longTasks: longTasks.length,
        longestTaskMs: longTasks.reduce((worst, one) => Math.max(worst, one), 0),
        maxGapMs: gaps.reduce((worst, one) => Math.max(worst, one), 0),
        appends: appends.length,
        appendP50Ms: sorted[Math.floor(sorted.length / 2)] ?? 0,
        pushedBytes,
        playedSeconds: video.currentTime,
      }
      window.watched = true
    } catch (error) {
      window.failure = String(error)
    }
  })
</script>
