<!doctype html>
<meta charset="utf-8" />
<!--
  The same strict policy as player.html: a site that forbids foreign frames outright is the case
  the bridge is most at risk from, and the page with sound has to stand up under it just as well.
  media-src blob: and style-src 'unsafe-inline' are there only so the page plays at all.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; frame-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src blob:"
/>
<title>test player with sound</title>
<!--
  Muted and looped, but with controls: six seconds of material is exactly the probation period,
  so the clip has to come round again for the watcher to count it through, and muted playback is
  the one kind a browser starts without a click of its own. A banner is told from a player by the
  controls, and those are here.
-->
<video id="v" controls muted loop width="640" style="background:#000"></video>
<script>
  const VIDEO_INIT = '/fixtures/h264/init-stream0.m4s'
  const AUDIO_INIT = '/fixtures/h264/init-stream1.m4s'
  const VIDEO = [1, 2, 3].map((n) => `/fixtures/h264/chunk-stream0-0000${n}.m4s`)
  const AUDIO = [1, 2, 3, 4].map((n) => `/fixtures/h264/chunk-stream1-0000${n}.m4s`)

  const video = document.getElementById('v')
  const mediaSource = new MediaSource()
  video.src = URL.createObjectURL(mediaSource)

  window.allAppended = false
  window.failure = null

  mediaSource.addEventListener('sourceopen', async () => {
    try {
      // Two SourceBuffers on one MediaSource: the layout of every MSE player there is. Both
      // report the same source to the hook and differ only by the buffer the bytes went into.
      const picture = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.4d401e"')
      const sound = mediaSource.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"')

      const append = (buffer, into) =>
        new Promise((resolve, reject) => {
          into.addEventListener('updateend', resolve, { once: true })
          into.addEventListener('error', () => reject(new Error('appendBuffer failed')), {
            once: true,
          })
          into.appendBuffer(buffer)
        })

      const fetchBytes = async (url) => (await fetch(url)).arrayBuffer()

      await append(await fetchBytes(VIDEO_INIT), picture)
      await append(await fetchBytes(AUDIO_INIT), sound)

      // Interleaved, the way a player loads them: the two buffers fill in step and not one
      // after the other.
      for (let i = 0; i < Math.max(VIDEO.length, AUDIO.length); i++) {
        if (VIDEO[i]) await append(await fetchBytes(VIDEO[i]), picture)
        if (AUDIO[i]) await append(await fetchBytes(AUDIO[i]), sound)
      }

      window.allAppended = true
    } catch (error) {
      // Otherwise a failure inside the handler sinks into a rejected promise and the test waits
      // for allAppended until its timeout, reporting the timeout instead of the reason.
      window.failure = String(error)
    }
  })
</script>
