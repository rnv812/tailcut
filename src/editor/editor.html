<!doctype html>
<meta charset="utf-8" />
<title>tailcut editor</title>
<style>
  /* The layout of §9.3: the player on top, the inspector down the right, the timeline below.
     One grid rather than nested boxes — the timeline has to keep its height while the player
     takes what is left, and that is what a row of 1fr and a row of pixels says. */
  body { margin: 0; height: 100vh; background: #101215; color: #e8eaed;
         font: 13px/1.45 system-ui, sans-serif; }
  .editor { display: grid; height: 100vh;
            grid-template-columns: 1fr 300px;
            grid-template-rows: auto 1fr 240px;
            grid-template-areas: "head inspector" "player inspector" "timeline inspector"; }
  .head { grid-area: head; padding: 10px 14px; border-bottom: 1px solid #22262c; }
  .player { grid-area: player; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; min-height: 0; padding: 12px; }
  .timeline { grid-area: timeline; border-top: 1px solid #22262c; padding: 10px; }
  .inspector { grid-area: inspector; border-left: 1px solid #22262c; padding: 12px;
               overflow-y: auto; }

  .pad { padding: 40px; max-width: 520px; }
  .muted { color: #9aa0a6; }
  .failure { color: #ffb3b3; }
  .title { font-weight: 500; font-size: 15px; }
  .meta { display: flex; gap: 12px; margin-top: 4px; }

  .inspector h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
                  letter-spacing: 0.06em; color: #9aa0a6; }
  .tracks { margin-bottom: 18px; }
  .track { display: flex; gap: 8px; flex-wrap: wrap; padding: 5px 0;
           border-bottom: 1px solid #1b1f24; }
  .kind { color: #4c8dff; }
  .option { display: flex; gap: 7px; align-items: center; margin: 4px 0; color: #9aa0a6; }

  video { max-width: 100%; max-height: 100%; background: #000; }
  .transport { display: flex; gap: 8px; align-items: center; }
  .transport button { padding: 5px 12px; border: 1px solid #3a3f47; border-radius: 6px;
                      background: none; color: #e8eaed; font: inherit; cursor: pointer; }
  .transport button:disabled { opacity: 0.5; cursor: default; }
  .readout { font-variant-numeric: tabular-nums; }
  /* The picture is behind the request: a held arrow outruns the decoder, and the number below
     the player is already the frame that was asked for. */
  .catching-up { color: #d8ab63; }
</style>
<body></body>
<script type="module" src="main.js"></script>
