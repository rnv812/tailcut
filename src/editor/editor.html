<!doctype html>
<meta charset="utf-8" />
<title>tailcut editor</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--tc-bg);
    color: var(--tc-text);
    font-size: 13px;
    line-height: 1.45;
  }
  .editor {
    display: grid;
    height: 100vh;
    grid-template-columns: clamp(220px, 18vw, 280px) minmax(420px, 1fr) clamp(300px, 22vw, 360px);
    grid-template-rows: auto minmax(260px, 1fr) minmax(300px, 42vh);
    grid-template-areas: "head head head" "media player inspector" "timeline timeline timeline";
    background:
      radial-gradient(circle at 38% -260px, rgba(183, 240, 63, 0.065), transparent 560px),
      var(--tc-bg);
  }
  .head {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    min-height: 56px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--tc-border);
    background: rgba(15, 16, 21, 0.74);
  }
  .head .tc-brand-mark { width: 32px; height: 32px; }
  .head-copy { flex: 1 1 auto; min-width: 0; }
  .head-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .head-actions button { white-space: nowrap; }
  .head-actions .tc-support-link { flex: 0 0 auto; }
  .head-actions .failure { font-size: 11px; }
  .media-panel {
    grid-area: media;
    min-width: 0;
    overflow-y: auto;
    padding: 16px 14px 24px;
    border-right: 1px solid var(--tc-border);
    background: rgba(20, 21, 27, 0.92);
  }
  .player {
    grid-area: player;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-width: 0;
    min-height: 0;
    padding: 14px 20px 10px;
    background: rgba(10, 11, 15, 0.46);
  }
  .timeline {
    grid-area: timeline;
    position: relative;
    min-width: 0;
    overflow: visible;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--tc-border);
    background: rgba(10, 11, 15, 0.72);
  }
  .tc-edit-tools { margin-bottom: 10px; }
  .tc-edit-workflow {
    margin: 0 0 8px;
    color: var(--tc-muted);
    font-size: 11px;
  }
  .tc-edit-workflow::first-letter { color: var(--tc-accent); }
  .tc-edit-selection {
    display: inline-flex;
    gap: 18px;
    margin: 0 0 8px;
    padding: 6px 10px;
    border: 1px solid rgba(183, 240, 63, 0.22);
    border-radius: 7px;
    background: rgba(183, 240, 63, 0.055);
    font-variant-numeric: tabular-nums;
  }
  .tc-edit-selection > div { display: flex; gap: 6px; align-items: baseline; }
  .tc-edit-selection dt {
    color: var(--tc-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .tc-edit-selection dd { margin: 0; color: var(--tc-paper); font-size: 11px; }
  .tc-edit-no-selection { margin: 0 0 8px; color: var(--tc-muted); font-size: 11px; }
  .tc-edit-tool-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .tc-edit-tool-group {
    display: inline-flex;
    flex: 0 0 auto;
    padding-right: 8px;
    border-right: 1px solid var(--tc-border);
  }
  .tc-edit-tool-group:last-child { padding-right: 0; border-right: 0; }
  .tc-edit-tool {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 32px;
    min-height: 30px;
    padding: 5px 8px;
    border-radius: 0;
    white-space: nowrap;
  }
  .tc-edit-tool:first-child { border-radius: 6px 0 0 6px; }
  .tc-edit-tool:last-child { border-radius: 0 6px 6px 0; }
  .tc-edit-tool + .tc-edit-tool { margin-left: -1px; }
  .tc-icon { display: block; width: 16px; height: 16px; }
  .tc-edit-tool[aria-pressed='true'] {
    border-color: rgba(183, 240, 63, 0.55);
    background: rgba(183, 240, 63, 0.12);
    color: var(--tc-accent);
  }
  .tc-timeline {
    max-height: calc(100% - 148px);
    overflow-x: hidden;
    overflow-y: auto;
    border: 1px solid var(--tc-border);
    border-radius: 7px;
    background: var(--tc-graphite);
  }
  .inspector {
    grid-area: inspector;
    min-width: 0;
    overflow-y: auto;
    padding: 16px 16px 28px;
    border-left: 1px solid var(--tc-border);
    background: rgba(23, 24, 31, 0.94);
    box-shadow: -16px 0 44px rgba(0, 0, 0, 0.16);
  }

  .pad { max-width: 560px; padding: 48px; }
  .muted { color: var(--tc-muted); }
  .failure { color: var(--tc-danger); }
  .title { overflow: hidden; color: var(--tc-paper); font-size: 15px; font-weight: 650;
           text-overflow: ellipsis; white-space: nowrap; }
  .head > .head-copy > .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; }

  button,
  select,
  input { font: inherit; }
  button {
    min-height: 31px;
    padding: 5px 10px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: var(--tc-surface-raised);
    color: var(--tc-text);
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #5a5f6c; background: var(--tc-surface-hover); }
  button:disabled { opacity: 0.45; }
  select,
  input[type='text'] {
    min-height: 30px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: #111218;
    color: var(--tc-text);
  }
  select { padding: 4px 7px; }
  input[type='checkbox'] { accent-color: var(--tc-accent); }

  .inspector h2,
  .media-panel h2 {
    margin: 0 0 8px;
    color: var(--tc-paper);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tracks { margin-bottom: 18px; }
  .tc-representation { margin-bottom: 12px; }
  .tc-representation select { min-width: 0; max-width: 245px; }
  .tc-representation p { margin: 5px 0 0; font-size: 11px; }
  .track {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 7px 0;
    border-bottom: 1px solid var(--tc-border);
  }
  .kind { color: var(--tc-accent); font-weight: 650; }
  .option { display: flex; gap: 7px; align-items: center; margin: 5px 0; color: var(--tc-muted); }
  .tc-panel-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tc-panel-heading h2 { margin-bottom: 2px; }
  .tc-panel-heading p { margin: 0; font-size: 11px; }
  .tc-count {
    display: inline-grid;
    min-width: 24px;
    height: 22px;
    place-items: center;
    padding: 0 6px;
    border: 1px solid var(--tc-border);
    border-radius: 999px;
    color: var(--tc-muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .tc-source-panel { padding-bottom: 14px; border-bottom: 1px solid var(--tc-border); }
  .tc-source-panel .tracks { margin-bottom: 0; }
  .tc-media-bin { padding-top: 16px; }
  .tc-bin-list { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
  .tc-bin-clip button {
    display: grid;
    width: 100%;
    grid-template-columns: 24px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: 9px;
    text-align: left;
  }
  .tc-bin-clip.selected button {
    border-color: var(--tc-accent);
    background: rgba(183, 240, 63, 0.1);
    box-shadow: inset 3px 0 0 var(--tc-accent);
  }
  .tc-bin-index { color: var(--tc-accent); font-size: 10px; font-variant-numeric: tabular-nums; }
  .tc-bin-copy { min-width: 0; }
  .tc-bin-copy strong,
  .tc-bin-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-bin-copy strong { color: var(--tc-paper); font-size: 12px; }
  .tc-bin-copy span,
  .tc-bin-duration { color: var(--tc-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .tc-empty {
    display: grid;
    gap: 3px;
    padding: 12px;
    border: 1px dashed var(--tc-border-strong);
    border-radius: 9px;
    color: var(--tc-muted);
  }
  .tc-empty strong { color: var(--tc-paper); }
  .tc-marker-heading { margin-top: 20px; }
  .tc-bin-empty { margin: 0; font-size: 11px; }
  .tc-icon-button { min-width: 28px; padding-inline: 6px; }

  video {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    background: #000;
    box-shadow: var(--tc-shadow);
  }
  .transport {
    display: grid;
    width: 100%;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    padding: 5px;
    border: 1px solid var(--tc-border);
    border-radius: 9px;
    background: rgba(20, 21, 27, 0.72);
  }
  .transport-left { display: flex; min-width: 0; justify-content: flex-end; align-items: center; gap: 8px; }
  .transport-center { display: flex; justify-content: center; }
  .transport-right { display: flex; min-width: 0; align-items: center; gap: 8px; }
  .transport-jump,
  .transport-playback,
  .transport-volume,
  .transport-edit { display: inline-flex; align-items: center; }
  .transport-jump,
  .transport-playback { padding: 2px; border: 1px solid var(--tc-border); border-radius: 7px; background: rgba(8, 9, 12, 0.38); }
  .transport-jump button,
  .transport-playback button { min-width: 30px; border-color: transparent; background: transparent; padding-inline: 6px; }
  .transport-jump button + button,
  .transport-playback button + button { border-left-color: var(--tc-border); border-radius: 0; }
  .transport-playback [data-testid='play'] {
    display: grid;
    width: 40px;
    min-width: 40px;
    padding-inline: 0;
    place-items: center;
    border-radius: 6px;
  }
  .transport-playback [data-icon='play'] { transform: translateX(-1px); }
  .transport-volume input { width: 70px; accent-color: var(--tc-accent); }
  .transport-end-mode { white-space: nowrap; }
  .transport-edit {
    gap: 8px;
    min-width: 0;
  }
  .tc-monitor-edit { color: var(--tc-accent); }
  .transport-edit .tc-field { margin-left: 2px; }
  .transport-edit .tc-field-input { width: 92px; }
  .transport [data-testid='play'],
  .tc-export-primary {
    border-color: var(--tc-accent);
    background: var(--tc-accent);
    color: var(--tc-graphite);
  }
  .transport [data-testid='play']:hover:not(:disabled),
  .tc-export-primary:hover:not(:disabled) {
    border-color: #c9ff5d;
    background: #c9ff5d;
  }
  .readout { color: var(--tc-muted); font-variant-numeric: tabular-nums; }
  .catching-up { color: var(--tc-warning); }

  .tc-clips,
  .tc-export {
    margin-top: 14px;
    padding-top: 15px;
    border-top: 1px solid var(--tc-border);
  }
  .tc-clips h2,
  .tc-export h2 { margin: 16px 0 8px; }
  .tc-clips > h2:first-child,
  .tc-export > h2:first-child { margin-top: 0; }
  .tc-clip-list { list-style: none; margin: 0; padding: 0; }
  .tc-clip {
    margin-bottom: 8px;
    padding: 11px;
    border: 1px solid var(--tc-border);
    border-radius: 9px;
    background: rgba(29, 31, 39, 0.8);
    cursor: pointer;
  }
  .tc-clip:hover { border-color: var(--tc-border-strong); }
  .tc-clip.selected {
    border-color: var(--tc-accent);
    box-shadow: inset 3px 0 0 var(--tc-accent), 0 0 0 1px rgba(183, 240, 63, 0.08);
  }
  .tc-clip-name {
    width: 100%;
    min-width: 0;
    padding: 0 2px 5px;
    border: 0;
    border-bottom: 1px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--tc-paper);
    font-weight: 650;
  }
  .tc-clip-name:hover,
  .tc-clip-name:focus { border-bottom-color: var(--tc-border-strong); }
  .tc-clip-header { display: flex; align-items: center; gap: 10px; }
  .tc-clip-remove { display: inline-grid; place-items: center; flex: 0 0 32px; width: 32px;
                    height: 32px; padding: 0; color: var(--tc-muted); }
  .tc-clip-remove svg { display: block; width: 16px; height: 16px; }
  .tc-clip-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--tc-border); }
  .tc-clip-section h3 { margin: 0; color: var(--tc-muted); font-size: 10px; font-weight: 700;
                        letter-spacing: .08em; text-transform: uppercase; }
  .tc-clip-section-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 9px; }
  .tc-clip-times { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .tc-clip-times .tc-field { display: grid; gap: 4px; }
  .tc-clip-times .tc-field-input { width: 100%; box-sizing: border-box; }
  .tc-clip-duration { display: flex; align-items: baseline; gap: 6px; }
  .tc-clip-duration > span { color: var(--tc-muted); font-size: 10px; }
  .tc-clip-length { color: var(--tc-muted); font-variant-numeric: tabular-nums; }
  .tc-clip-options { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: end; margin-top: 8px; }
  .tc-clip-options .option { margin: 0; }
  .tc-clip-select { display: grid; gap: 4px; }
  .tc-clip-select select { width: 100%; min-width: 0; }
  .tc-clip-sound { min-height: 30px; }
  .tc-clip-options button { min-height: 27px; padding: 3px 8px; }
  .tc-clip-note { margin: 7px 0 0; color: var(--tc-warning); font-size: 11px; }

  .tc-picture-frame { position: relative; display: flex; min-height: 0; max-width: 100%; max-height: 100%;
                      overflow: hidden; isolation: isolate; border-radius: 6px; }
  .tc-picture-frame > video { display: block; }
  .tc-crop-host { position: absolute; inset: 0; pointer-events: none; }
  .tc-crop-box {
    position: absolute;
    box-sizing: border-box;
    border: 2px solid var(--tc-accent);
    box-shadow: 0 0 0 100vmax rgba(8, 10, 12, 0.58), 0 0 0 1px rgba(0, 0, 0, 0.45);
    pointer-events: auto;
    cursor: move;
  }
  .tc-crop-handle { position: absolute; width: 10px; height: 10px; border: 1px solid var(--tc-graphite);
                    border-radius: 2px; background: var(--tc-accent); }
  .tc-crop-nw { left: -1px; top: -1px; cursor: nwse-resize; }
  .tc-crop-n { left: calc(50% - 5px); top: -1px; cursor: ns-resize; }
  .tc-crop-ne { right: -1px; top: -1px; cursor: nesw-resize; }
  .tc-crop-e { right: -1px; top: calc(50% - 5px); cursor: ew-resize; }
  .tc-crop-se { right: -1px; bottom: -1px; cursor: nwse-resize; }
  .tc-crop-s { left: calc(50% - 5px); bottom: -1px; cursor: ns-resize; }
  .tc-crop-sw { left: -1px; bottom: -1px; cursor: nesw-resize; }
  .tc-crop-w { left: -1px; top: calc(50% - 5px); cursor: ew-resize; }
  .tc-crop-controls {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--tc-border);
    border-radius: 9px;
    background: rgba(29, 31, 39, 0.72);
    flex-wrap: wrap;
  }
  .tc-crop-controls button { min-height: 27px; padding: 3px 8px; }
  .tc-clip-warn { color: var(--tc-warning); }

  .tc-marker-list { list-style: none; margin: 0; padding: 0; }
  .tc-marker { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .tc-marker button { min-height: 27px; padding: 3px 7px; }
  .tc-marker-go { font-variant-numeric: tabular-nums; }

  .tc-field { display: flex; gap: 6px; align-items: center; }
  .tc-field-label { color: var(--tc-muted); font-size: 11px; }
  .tc-field-input {
    width: 102px;
    min-height: 28px;
    padding: 3px 6px;
    border: 1px solid var(--tc-border-strong);
    border-radius: 6px;
    background: #111218;
    color: var(--tc-text);
    font-variant-numeric: tabular-nums;
  }
  .tc-field-input.invalid { border-color: var(--tc-danger); color: #ffc0c7; }

  .tc-thumb { z-index: 3; padding: 5px; border: 1px solid var(--tc-border-strong); border-radius: 8px;
              background: #0b0c10; box-shadow: var(--tc-shadow); }
  .tc-thumb-time { color: var(--tc-muted); text-align: center; font-variant-numeric: tabular-nums; }

  .tc-export p { margin: 7px 0 0; font-size: 11px; }
  .tc-export-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                       gap: 8px; }
  .tc-jobs { list-style: none; margin: 10px 0 0; padding: 0; }
  .tc-job { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--tc-border);
            flex-wrap: wrap; }
  .tc-job-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-job-state { color: var(--tc-muted); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
                  text-transform: uppercase; }
  .tc-job.running .tc-job-state { color: var(--tc-accent); }
  .tc-job.done .tc-job-state { color: var(--tc-success); }
  .tc-job.failed .tc-job-state { color: var(--tc-danger); }
  .tc-job-error { flex-basis: 100%; color: #ffc0c7; font-size: 11px; }
  .tc-job button { min-height: 27px; padding: 3px 7px; }

  .tc-help { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
             padding: 24px; background: rgba(8, 9, 12, 0.78); backdrop-filter: blur(5px); }
  .tc-help-sheet { max-height: 84vh; overflow-y: auto; padding: 22px 26px; border: 1px solid var(--tc-border-strong);
                   border-radius: var(--tc-radius); background: var(--tc-surface); box-shadow: var(--tc-shadow); }
  .tc-help-sheet th { padding: 4px 20px 4px 0; color: var(--tc-accent); font-weight: 650; text-align: left;
                      white-space: nowrap; }
  .tc-help-sheet td { padding: 4px 0; color: var(--tc-muted); }
  .tc-help-sheet button { margin-top: 14px; }

  @media (max-width: 1050px) {
    body { height: auto; overflow: auto; }
    .editor {
      height: auto;
      min-height: 100vh;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: auto minmax(320px, 56vh) minmax(300px, 42vh) auto;
      grid-template-areas: "head head" "media player" "timeline timeline" "inspector inspector";
    }
    .inspector { overflow: visible; border-top: 1px solid var(--tc-border); border-left: 0; }
    .player { padding-inline: 12px; }
  }

  @media (max-width: 720px) {
    .editor {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(300px, 60vh) minmax(300px, auto) auto;
      grid-template-areas: "head" "media" "player" "timeline" "inspector";
    }
    .media-panel { overflow: visible; border-right: 0; border-bottom: 1px solid var(--tc-border); }
    .head { align-items: flex-start; flex-wrap: wrap; }
    .head-actions { flex: 1 0 100%; justify-content: flex-end; flex-wrap: wrap; margin-left: 0; }
  }
</style>
<body></body>
<script type="module" src="main.js"></script>
