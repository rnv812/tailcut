<!doctype html>
<meta charset="utf-8" />
<title>tailcut settings</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 24px 72px;
    background:
      radial-gradient(circle at 50% -180px, rgba(183, 240, 63, 0.11), transparent 390px),
      var(--tc-bg);
    color: var(--tc-text);
    font-size: 14px;
    line-height: 1.5;
  }

  main,
  .loading { max-width: 760px; margin: 0 auto; }
  .loading { color: var(--tc-muted); }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 4px;
  }
  .page-head .tc-brand-mark { width: 36px; height: 36px; }
  h1 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -0.04em; }
  .page-head p { margin: 1px 0 0; color: var(--tc-muted); font-size: 12px; }

  .group {
    margin-bottom: 16px;
    padding: 20px 22px 22px;
    border: 1px solid var(--tc-border);
    border-radius: var(--tc-radius);
    background: rgba(23, 24, 31, 0.92);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.025);
  }
  .group h2 {
    margin: 0 0 14px;
    color: var(--tc-paper);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.035em;
    text-transform: uppercase;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 7px 0;
    flex-wrap: wrap;
  }
  .row .label { flex: 0 0 150px; color: var(--tc-muted); }
  .row .value { color: var(--tc-muted); font-variant-numeric: tabular-nums; }
  .row b { font-weight: 650; }
  .row em { display: block; margin-top: 3px; color: var(--tc-muted); font-size: 12px; font-style: normal; }

  .row.mode {
    align-items: flex-start;
    margin: 6px 0;
    padding: 11px 12px;
    border: 1px solid var(--tc-border);
    border-radius: 9px;
    background: var(--tc-surface-raised);
    cursor: pointer;
  }
  .row.mode:hover { border-color: var(--tc-border-strong); background: var(--tc-surface-hover); }
  .row.mode:has(input:checked) {
    border-color: var(--tc-accent);
    box-shadow: inset 3px 0 0 var(--tc-accent);
  }
  .row.mode input { margin-top: 3px; }

  .note { margin: 5px 0 12px; color: var(--tc-muted); font-size: 12px; }
  .note.limit { flex-basis: 100%; margin: 0; color: var(--tc-warning); }
  .note.full,
  .note.refused { color: var(--tc-warning); }

  input[type='range'] { flex: 1 1 240px; min-width: 180px; accent-color: var(--tc-accent); }
  input[type='checkbox'],
  input[type='radio'] { width: 16px; height: 16px; accent-color: var(--tc-accent); }
  input[type='number'],
  input[type='text'],
  select {
    min-height: 34px;
    padding: 6px 9px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: #111218;
    color: var(--tc-text);
    font: inherit;
  }
  input[type='number'] { width: 92px; }
  input[type='text'] { flex: 1 1 220px; min-width: 0; }
  input:hover:not(:disabled),
  select:hover:not(:disabled) { border-color: #5a5f6c; }
  input:disabled,
  select:disabled { opacity: 0.48; }

  button {
    min-height: 34px;
    padding: 6px 13px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: var(--tc-surface-raised);
    color: var(--tc-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #5a5f6c; background: var(--tc-surface-hover); }
  button.quiet { border-color: transparent; background: transparent; color: var(--tc-muted); }
  button.quiet:hover { color: var(--tc-text); }

  .hosts { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--tc-border); }
  .host-add { display: flex; gap: 8px; margin-bottom: 8px; }
  .host-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 42px;
    padding: 5px 8px;
    border-radius: 8px;
  }
  .host-row:hover { background: rgba(255, 255, 255, 0.025); }
  .host-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-row .allowed { border-color: rgba(125, 221, 158, 0.38); color: var(--tc-success); }
  .host-row .denied { border-color: rgba(255, 128, 142, 0.38); color: var(--tc-danger); }

  .advanced { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--tc-border); }
  .advanced summary {
    width: fit-content;
    padding: 4px 0;
    color: var(--tc-muted);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .advanced summary:hover { color: var(--tc-accent); }
  .advanced[open] summary { margin-bottom: 8px; color: var(--tc-paper); }

  .reset { margin-top: 24px; text-align: right; }
  .reset button { color: var(--tc-muted); }

  @media (max-width: 620px) {
    body { padding: 24px 14px 48px; }
    .group { padding: 17px 16px 19px; }
    .row .label { flex-basis: 100%; }
    .host-add { align-items: stretch; }
  }
</style>
<body></body>
<script type="module" src="options.js"></script>
