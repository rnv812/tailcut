<!doctype html>
<meta charset="utf-8" />
<title>tailcut settings</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 24px 72px;
    background:
      radial-gradient(circle at 50% -180px, rgba(183, 240, 63, 0.11), transparent 390px),
      var(--tc-bg);
    color: var(--tc-text);
    font-size: 14px;
    line-height: 1.5;
  }

  main,
  .loading { max-width: 860px; margin: 0 auto; }
  .loading { color: var(--tc-muted); }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 0 4px;
  }
  .page-head .tc-brand-mark { width: 36px; height: 36px; }
  .page-head .tc-support-link { flex: 0 0 auto; }
  h1 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -0.04em; }
  .page-head p { margin: 1px 0 0; color: var(--tc-muted); font-size: 12px; }

  .group {
    margin-bottom: 16px;
    overflow: hidden;
    border: 1px solid var(--tc-border);
    border-radius: var(--tc-radius);
    background: rgba(23, 24, 31, 0.92);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.025), 0 14px 36px rgba(0, 0, 0, 0.12);
  }
  .group h2 {
    margin: 0;
    padding: 17px 22px 14px;
    border-bottom: 1px solid var(--tc-border);
    background: linear-gradient(90deg, rgba(183, 240, 63, 0.055), transparent 38%);
    color: var(--tc-paper);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.035em;
    text-transform: uppercase;
  }
  .group-body { padding: 16px 22px 22px; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 8px 0;
    flex-wrap: wrap;
  }
  .row .label { flex: 0 0 170px; color: var(--tc-muted); }
  .row .value { color: var(--tc-muted); font-variant-numeric: tabular-nums; }
  .row b { font-weight: 650; }
  .row em { display: block; margin-top: 3px; color: var(--tc-muted); font-size: 12px; font-style: normal; }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
    margin-bottom: 16px;
  }
  .row.mode {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: flex-start;
    margin: 0;
    padding: 13px;
    border: 1px solid var(--tc-border);
    border-radius: 9px;
    background: var(--tc-surface-raised);
    cursor: pointer;
  }
  .row.mode:hover { border-color: var(--tc-border-strong); background: var(--tc-surface-hover); }
  .row.mode:has(input:checked) {
    border-color: var(--tc-accent);
    box-shadow: inset 3px 0 0 var(--tc-accent);
  }
  .row.mode input { margin-top: 3px; }

  .note { margin: 5px 0 12px; color: var(--tc-muted); font-size: 12px; }
  .note.limit { flex-basis: 100%; margin: 0; color: var(--tc-warning); }
  .note.full,
  .note.refused { color: var(--tc-warning); }

  input[type='range'] {
    flex: 1 1 240px;
    min-width: 180px;
    height: 28px;
    accent-color: var(--tc-accent);
  }
  input[type='checkbox'],
  input[type='radio'] { width: 16px; height: 16px; accent-color: var(--tc-accent); }
  input[type='number'],
  input[type='text'],
  select {
    min-height: 34px;
    padding: 6px 9px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: #111218;
    color: var(--tc-text);
    font: inherit;
  }
  input[type='number'] { width: 92px; }
  input[type='text'] { flex: 1 1 220px; min-width: 0; }
  input:hover:not(:disabled),
  select:hover:not(:disabled) { border-color: #5a5f6c; }
  input:disabled,
  select:disabled { opacity: 0.48; }

  button {
    min-height: 34px;
    padding: 6px 13px;
    border: 1px solid var(--tc-border-strong);
    border-radius: var(--tc-radius-sm);
    background: var(--tc-surface-raised);
    color: var(--tc-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #5a5f6c; background: var(--tc-surface-hover); }
  button.quiet { border-color: transparent; background: transparent; color: var(--tc-muted); }
  button.quiet:hover { color: var(--tc-text); }

  .hosts {
    margin-top: 14px;
    padding: 14px;
    border: 1px solid var(--tc-border);
    border-radius: 10px;
    background: rgba(10, 11, 15, 0.28);
  }
  .host-add { display: flex; gap: 8px; margin-bottom: 8px; }
  .host-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 42px;
    padding: 5px 8px;
    border-radius: 8px;
  }
  .host-row:hover { background: rgba(255, 255, 255, 0.025); }
  .host-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 68px;
    min-height: 27px;
    padding: 3px 8px;
    border: 1px solid var(--tc-border-strong);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.025);
    font-size: 11px;
    font-weight: 700;
  }
  .host-status.allowed { border-color: rgba(125, 221, 158, 0.38); color: var(--tc-success); }
  .host-status.blocked { border-color: rgba(255, 128, 142, 0.38); color: var(--tc-danger); }
  .host-action { min-width: 64px; }

  .advanced { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--tc-border); }
  .advanced-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 5px 9px;
    border-radius: var(--tc-radius-sm);
    color: var(--tc-muted);
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    user-select: none;
  }
  .advanced-toggle::-webkit-details-marker { display: none; }
  .advanced-toggle::before {
    content: '';
    width: 7px;
    height: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 120ms ease;
  }
  .advanced-toggle:hover { background: rgba(255, 255, 255, 0.035); color: var(--tc-accent); }
  .advanced[open] .advanced-toggle { color: var(--tc-paper); }
  .advanced[open] .advanced-toggle::before { transform: rotate(45deg) translate(-1px, -1px); }
  .advanced-panel {
    margin-top: 8px;
    padding: 10px 14px 6px;
    border: 1px solid var(--tc-border);
    border-radius: 10px;
    background: rgba(10, 11, 15, 0.28);
  }

  .reset { margin-top: 24px; text-align: right; }
  .reset button { color: var(--tc-muted); }
  .reset + .legal-footer {
    margin-top: 16px;
    padding: 16px 4px 0;
    border-top: 1px solid var(--tc-border);
  }

  @media (max-width: 760px) {
    body { padding: 24px 14px 48px; }
    .group h2 { padding-inline: 16px; }
    .group-body { padding: 14px 16px 18px; }
    .mode-grid { grid-template-columns: 1fr; }
    .row .label { flex-basis: 100%; }
    .host-add { align-items: stretch; }
  }
</style>
<body></body>
<script type="module" src="options.js"></script>
