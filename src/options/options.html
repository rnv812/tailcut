<!doctype html>
<meta charset="utf-8" />
<title>tailcut settings</title>
<style>
  /* One column and nothing beside it. The page is opened in a tab of its own (open_in_tab), so
     there is a whole window to spend; spending it on width would put a slider's label a screen
     away from the slider. */
  body { margin: 0; padding: 28px 20px 60px; background: #101215; color: #e8eaed;
         font: 13px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 20px; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
  .loading { max-width: 640px; margin: 0 auto; color: #9aa0a6; }

  /* A group is a card: §9.4 is four of them in the order a recording lives through, and the
     border is what says where one question ends and the next begins. */
  .group { margin-bottom: 16px; padding: 14px 16px 16px;
           border: 1px solid #22262c; border-radius: 10px; background: #14171b; }
  .group h2 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase;
              letter-spacing: 0.07em; color: #9aa0a6; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         padding: 6px 0; }
  .row .label { flex: 0 0 130px; color: #9aa0a6; }
  .row .value { color: #9aa0a6; font-variant-numeric: tabular-nums; }
  .row.mode { align-items: flex-start; }
  .row b { font-weight: 500; }
  .row em { display: block; margin-top: 2px; color: #9aa0a6; font-style: normal; }

  .note { margin: 4px 0 10px; color: #9aa0a6; }
  /* A value the page would not take, said beside the control that would not take it. Warm rather
     than red: nothing failed, the number was simply held to what the setting allows. */
  .note.limit { flex-basis: 100%; margin: 0; color: #d8ab63; }
  .note.full { color: #d8ab63; }

  input[type='range'] { flex: 1 1 200px; accent-color: #4c8dff; }
  input[type='number'], input[type='text'] {
    padding: 5px 8px; border: 1px solid #3a3f47; border-radius: 6px;
    background: #0d0f12; color: #e8eaed; font: inherit; }
  input[type='number'] { width: 84px; }
  input[type='text'] { flex: 1 1 180px; }
  input[type='checkbox'], input[type='radio'] { accent-color: #4c8dff; }
  select { padding: 5px 8px; border: 1px solid #3a3f47; border-radius: 6px;
           background: #0d0f12; color: #e8eaed; font: inherit; }
  input:disabled, select:disabled { opacity: 0.5; }
  button { padding: 5px 12px; border: 1px solid #3a3f47; border-radius: 6px;
           background: none; color: #e8eaed; font: inherit; cursor: pointer; }
  button:hover { background: #1e2126; }
  button.quiet { border-color: transparent; color: #9aa0a6; }

  .hosts { margin-top: 10px; padding-top: 10px; border-top: 1px solid #1b1f24; }
  .host-add { display: flex; gap: 8px; margin-bottom: 6px; }
  .host-row { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .host-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host-row .allowed { color: #7bd88f; }
  .host-row .denied { color: #ff9f9f; }

  /* A <details> and not an accordion of our own: it comes with a keyboard, with find-in-page and
     with a state, none of which we would get right for free. The marker stays — it is the only
     thing that says the block opens. */
  .advanced { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1b1f24; }
  .advanced summary { color: #9aa0a6; cursor: pointer; user-select: none; }
  .advanced summary:hover { color: #e8eaed; }

  .reset { margin-top: 20px; }
</style>
<body></body>
<script type="module" src="options.js"></script>
