<!doctype html>
<meta charset="utf-8" />
<title>tailcut</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  body {
    margin: 0;
    width: 380px;
    min-height: 360px;
    max-height: 600px;
    overflow-y: auto;
    background:
      radial-gradient(circle at 80% -80px, rgba(183, 240, 63, 0.12), transparent 230px),
      var(--tc-bg);
    color: var(--tc-text);
    font-size: 13px;
    line-height: 1.45;
  }
  .top {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 52px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--tc-border);
    background: rgba(15, 16, 21, 0.94);
    backdrop-filter: blur(8px);
  }
  .top .tc-brand-mark { width: 27px; height: 27px; }
  .top .tc-brand-name { font-size: 17px; }
  .top .tc-support-link { flex: 0 0 auto; }

  .pad {
    margin: 12px;
    padding: 14px;
    border: 1px solid var(--tc-border);
    border-radius: var(--tc-radius);
    background: rgba(23, 24, 31, 0.9);
  }
  .muted { color: var(--tc-muted); font-size: 11px; }
  .title { overflow: hidden; color: var(--tc-paper); font-size: 14px; font-weight: 650;
           text-overflow: ellipsis; white-space: nowrap; }
  .host { margin-top: 2px; }
  .meta { display: flex; align-items: center; gap: 8px; margin: 10px 0 13px; }
  .meta > span {
    padding: 3px 7px;
    border: 1px solid var(--tc-border);
    border-radius: 999px;
    background: var(--tc-surface-raised);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .buttons { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  button { font: inherit; cursor: pointer; }
  .primary,
  .secondary {
    min-height: 36px;
    padding: 7px 14px;
    border-radius: var(--tc-radius-sm);
    font-size: 12px;
    font-weight: 700;
  }
  .primary { border: 1px solid var(--tc-accent); background: var(--tc-accent); color: var(--tc-graphite); }
  .primary:hover:not(:disabled) { border-color: #c9ff5d; background: #c9ff5d; }
  .secondary { border: 1px solid var(--tc-border-strong); background: var(--tc-surface-raised);
               color: var(--tc-text); }
  .secondary:hover:not(:disabled) { border-color: #5a5f6c; background: var(--tc-surface-hover); }
  .primary:disabled,
  .secondary:disabled { opacity: 0.5; }

  .omits {
    margin: -2px 0 11px;
    padding: 7px 8px;
    border-left: 2px solid var(--tc-warning);
    border-radius: 0 6px 6px 0;
    background: rgba(239, 189, 101, 0.07);
    color: var(--tc-warning);
    font-size: 11px;
  }
  .failed {
    margin-top: 9px;
    padding: 7px 8px;
    border-left: 2px solid var(--tc-danger);
    border-radius: 0 6px 6px 0;
    background: rgba(255, 128, 142, 0.07);
    color: #ffc0c7;
    font-size: 11px;
  }

  .recordings {
    margin: 0 12px 12px;
    padding: 10px;
    border: 1px solid var(--tc-border);
    border-radius: var(--tc-radius);
    background: rgba(23, 24, 31, 0.78);
  }
  .recordings .pad { margin: 0 0 8px; }
  .section-heading { margin: 0; padding: 1px 4px 9px; color: var(--tc-paper); font-size: 12px;
                     font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
  .history, .recent-sessions { display: grid; gap: 5px; }
  .label {
    padding: 0 7px 6px;
    color: var(--tc-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .row {
    display: flex;
    width: 100%;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 7px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    text-align: left;
  }
  .row:hover:enabled,
  .history-row:hover { background: var(--tc-surface-hover); }
  .row-title { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .session-row {
    display: grid;
    min-width: 0;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px 8px;
    background: rgba(29, 31, 39, 0.72);
  }
  .session-open {
    display: grid;
    width: 100%;
    min-width: 0;
    gap: 2px;
    padding: 2px 0;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
  }
  .session-open:hover:not(:disabled) .row-title { color: var(--tc-accent); }
  .session-meta { display: flex; align-items: center; gap: 6px; }
  .recording-state {
    display: inline-flex;
    align-items: center;
    padding: 1px 5px;
    border: 1px solid var(--tc-border-strong);
    border-radius: 999px;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: .03em;
    line-height: 1.4;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .recording-state.live { border-color: rgba(183, 240, 63, .35); color: var(--tc-accent); }
  .recording-state.stored { color: var(--tc-muted); }
  .history-source { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .history-source [data-testid='history-host'] {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-actions { display: flex; gap: 5px; }
  .session-note,
  .session-failure { grid-column: 1 / -1; }
  .session-note { color: var(--tc-warning); font-size: 10px; }
  .session-failure { margin-top: 0; }

  .history-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; padding: 3px 5px;
                 align-items: center; }
  .history-open {
    display: grid;
    min-width: 0;
    gap: 1px 10px;
    padding: 5px 2px;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title length" "host when";
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
  }
  .history-open > :nth-child(1) { grid-area: title; }
  .history-open > :nth-child(2) { grid-area: host; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-open > :nth-child(3) { grid-area: length; }
  .history-open > :nth-child(3),
  .history-open > :nth-child(4) { text-align: right; white-space: nowrap; }
  .history-open > :nth-child(4) { grid-area: when; }

  .quiet {
    min-height: 28px;
    padding: 4px 8px;
    border: 1px solid var(--tc-border-strong);
    border-radius: 6px;
    background: transparent;
    color: var(--tc-muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .quiet:hover { border-color: #5a5f6c; background: var(--tc-surface-hover); color: var(--tc-text); }
  .quiet.danger { color: #ff9da8; }

  .toast {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 7px 5px 0;
    padding: 8px 9px;
    border: 1px solid var(--tc-border);
    border-radius: 8px;
    background: var(--tc-surface-raised);
  }
  .toast span { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { min-height: 27px; padding: 3px 9px; border: 0; border-radius: 6px;
                  background: var(--tc-accent); color: var(--tc-graphite); font-weight: 700; }

  .site-control,
  .storage-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px 12px;
    align-items: center;
    margin: 0 12px 12px;
    padding: 12px;
    border: 1px solid var(--tc-border);
    border-radius: var(--tc-radius);
    background: rgba(23, 24, 31, 0.78);
  }
  .site-control { margin-top: 12px; }
  .storage-bar { grid-template-columns: minmax(0, 1fr) auto; }
  .storage-numbers { display: grid; gap: 2px; color: var(--tc-muted); font-size: 11px; }
  .storage-actions { display: flex; justify-content: flex-end; gap: 5px; }
  .clear-confirm { display: flex; gap: 5px; }
  .storage-bar > .failed { grid-column: 1 / -1; margin-top: 0; }
  .switch { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
  .switch input {
    position: relative;
    width: 30px;
    height: 18px;
    margin: 0;
    flex: 0 0 auto;
    appearance: none;
    border: 1px solid var(--tc-border-strong);
    border-radius: 999px;
    background: #292c34;
  }
  .switch input::before {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--tc-muted);
    content: '';
    transition: transform 120ms ease, background-color 120ms ease;
  }
  .switch input:checked { border-color: var(--tc-accent); background: rgba(183, 240, 63, 0.16); }
  .switch input:checked::before { transform: translateX(12px); background: var(--tc-accent); }
  .switch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch b { font-weight: 650; }
  .switch:has(input:disabled) { color: var(--tc-subtle); cursor: default; }
  .site-control .quiet,
  .storage-actions { justify-self: end; }
  .site-control .why { grid-column: 1 / -1; }
  .legal-screen { padding-bottom: 12px; }
  .legal-consent { margin: 12px; padding: 16px; }
  .legal-footer {
    margin: 0 12px 12px;
    padding: 10px 2px 2px;
    border-top: 1px solid var(--tc-border);
  }
</style>
<body></body>
<script type="module" src="popup.js"></script>
