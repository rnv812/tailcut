<!doctype html>
<meta charset="utf-8" />
<title>tailcut</title>
<style>
  /* The height is floored: without it the popup opens as a "Loading…" strip and jumps when the
     tab's answer arrives. */
  body { margin: 0; width: 340px; min-height: 118px; background: #15171a; color: #e8eaed;
         font: 13px/1.4 system-ui, sans-serif; }
  .top { padding: 10px 12px; border-bottom: 1px solid #26292e; }
  .pad { padding: 12px; }
  .muted { color: #9aa0a6; font-size: 11px; }
  .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host { margin-top: 2px; }
  .meta { display: flex; gap: 10px; align-items: baseline; margin: 8px 0 12px; }
  .primary { width: 100%; padding: 8px 0; border: 0; border-radius: 7px;
             background: #4c8dff; color: #0b0d10; font-weight: 600; font-size: 12px;
             cursor: pointer; }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .buttons { display: flex; gap: 8px; }
  .primary { flex: 1; }
  .secondary { padding: 8px 14px; border: 1px solid #3a3f47; border-radius: 7px;
               background: none; color: #e8eaed; font-weight: 600; font-size: 12px;
               cursor: pointer; }
  .secondary:disabled { opacity: 0.6; cursor: default; }
  /* What the file will be missing. A caveat and not a failure: the save will go through, and
     the length above it is already the length of the file. */
  .omits { margin: -4px 0 10px; font-size: 11px; color: #d8ab63; }
  .failed { margin-top: 8px; font-size: 11px; color: #ff8f8f; }
  /* The other sessions of the page. Below the current one and separated from it: the top block
     is what is being recorded now, and a click down here changes what that block shows. */
  .recent { padding: 8px 6px 10px; border-top: 1px solid #26292e; }
  .label { padding: 0 6px 4px; }
  .row { display: flex; width: 100%; gap: 10px; align-items: baseline;
         justify-content: space-between; padding: 6px; border: 0; border-radius: 6px;
         background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row:hover:enabled { background: #1e2126; }
  .row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
<body></body>
<script type="module" src="popup.js"></script>
