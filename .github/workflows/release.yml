name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build the extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e:fast

      - name: Package the installable extension
        run: node tools/package-release.mjs "$GITHUB_REF_NAME"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            release/*.sha256 \
            --notes "Download the Chrome ZIP, extract it, then choose the extracted tailcut-$GITHUB_REF_NAME-chrome folder in chrome://extensions → Load unpacked." \
            "${flags[@]}"
